<svg xmlns="http://www.w3.org/2000/svg" width="496" height="580" viewBox="0 0 496 580">
  <rect width="100%" height="100%" fill="#f8f8f8"/>

  <!-- Titel -->
  <text x="248" y="20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#222">
    Schacht Grundriss – OTIS 1000 kg
  </text>

  <!-- Äußeres Rechteck: 2200 x 2500 @ (1,1) -->
  <rect x="50" y="75"
        width="396" height="450"
        fill="#e8e8e8" stroke="#222" stroke-width="2.5"/>
  <text x="55" y="89"
        font-family="Arial" font-size="9" fill="#555">Schacht (2200 x 2500)</text>

  <!-- Inneres Rechteck: 1800 x 2100 @ (200,200) -->
  <rect x="86" y="111"
        width="324" height="378"
        fill="#d0e8ff" stroke="#0066cc" stroke-width="1.5"/>
  <text x="248" y="304"
        text-anchor="middle" font-family="Arial" font-size="10" fill="#0066cc">
    Kabine (1800 x 2100)
  </text>

  <!-- Bemaßung: Breite äußeres Rechteck -->
  <line x1="50" y1="543"
        x2="446" y2="543"
        stroke="#444" stroke-width="1"/>
  <line x1="50" y1="537"
        x2="50" y2="549"
        stroke="#444" stroke-width="1"/>
  <line x1="446" y1="537"
        x2="446" y2="549"
        stroke="#444" stroke-width="1"/>
  <text x="248" y="559"
        text-anchor="middle" font-family="Arial" font-size="10" fill="#333">2200 mm</text>

  <!-- Bemaßung: Höhe äußeres Rechteck -->
  <line x1="464" y1="75"
        x2="464" y2="525"
        stroke="#444" stroke-width="1"/>
  <line x1="458" y1="75"
        x2="470" y2="75"
        stroke="#444" stroke-width="1"/>
  <line x1="458" y1="525"
        x2="470" y2="525"
        stroke="#444" stroke-width="1"/>
  <text x="480" y="304"
        text-anchor="middle" font-family="Arial" font-size="10" fill="#333"
        transform="rotate(90, 480, 304)">2500 mm</text>

  <!-- Koordinaten-Ursprung Hinweis -->
  <text x="50" y="71" font-family="Arial" font-size="8" fill="#999">(0,0)</text>
  <circle cx="50" cy="75" r="2" fill="#999"/>
</svg>